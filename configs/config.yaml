auth:
  enabled: true
  principals:
    - id: local/demo-client
      tokenEnv: THINKPIXELGR_DEMO_TOKEN
      tenants: [demo]
      policyReader: true
      metricsReader: true

platform:
  mandatoryPolicies:
    - platform/request-limits@1
    - platform/secrets@1

tenants:
  demo:
    mandatoryPolicies:
      - tenant/demo/pii@1

policies:
  - metadata:
      id: platform/request-limits
      version: 1
    spec:
      stages: [pre_request, pre_model, post_model, pre_tool, post_tool, pre_retrieval, post_retrieval, ingestion]
      action: block
      failureMode: closed
      timeout: 25ms
      detectors:
        - id: builtin/request-limits@1
          timeout: 10ms
          requestLimits:
            maxRequestBytes: 900000
            maxMessages: 256
            maxMessageBytes: 262144
            maxTools: 128
            maxAttachments: 32
            maxEstimatedTokens: 262144

  - metadata:
      id: platform/secrets
      version: 1
    spec:
      stages: [pre_model, post_tool, ingestion]
      action: redact
      failureMode: closed
      timeout: 25ms
      detectors:
        - id: builtin/structured-secrets@1
          timeout: 10ms
          secrets:
            replacement: '<SECRET>'
            severity: critical

  - metadata:
      id: tenant/demo/pii
      version: 1
    spec:
      stages: [pre_model, post_model]
      action: redact
      failureMode: closed
      timeout: 25ms
      detectors:
        - id: builtin/email-regex@1
          timeout: 10ms
          regex:
            pattern: '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
            category: pii.email
            replacement: '<EMAIL_ADDRESS>'
            severity: medium

  - metadata:
      id: platform/injection-keywords
      version: 1
    spec:
      stages: [pre_model, post_retrieval]
      action: block
      failureMode: closed
      timeout: 25ms
      detectors:
        - id: builtin/injection-keywords@1
          timeout: 10ms
          keywords:
            values: ["ignore previous instructions", "reveal the system prompt"]
            category: prompt_injection.indicator
            severity: high

  - metadata:
      id: platform/model-list
      version: 1
    spec:
      stages: [pre_request, pre_model]
      action: block
      failureMode: closed
      timeout: 25ms
      detectors:
        - id: builtin/model-list@1
          timeout: 10ms
          allowDeny:
            selector: target.model
            deny: [unapproved-model]
            category: request.model_denied

  - metadata:
      id: application/tool-arguments
      version: 1
    spec:
      stages: [pre_tool]
      action: block
      failureMode: closed
      timeout: 25ms
      detectors:
        - id: builtin/tool-arguments-schema@1
          timeout: 10ms
          jsonSchema:
            target: content.data
            category: schema.tool_arguments
            schema:
              type: object
              required: [tool, arguments]
              properties:
                tool: {type: string, minLength: 1}
                arguments: {type: object}
              additionalProperties: false

profiles:
  - metadata:
      id: baseline
      version: 1
    spec:
      policies:
        - platform/injection-keywords@1
        - platform/model-list@1
