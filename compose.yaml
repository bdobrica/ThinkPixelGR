services:
  thinkpixelgr:
    build: .
    ports:
      - "8080:8080"
    environment:
      THINKPIXELGR_DEMO_TOKEN: ${THINKPIXELGR_DEMO_TOKEN:?set THINKPIXELGR_DEMO_TOKEN before starting}
    volumes:
      - ./configs/config.yaml:/configs/config.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
